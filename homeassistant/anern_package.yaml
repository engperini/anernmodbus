# Home Assistant package: Anern AN-SCI-ECO-4200 inverter (RWB1 BLE -> MQTT bridge)
#
# Install: in configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
# then copy (or link) this file to <config>/packages/anern.yaml and restart HA.
#
# Works with any dongle: the locks go to the fixed topic solar/rwb1_ble/locks.

input_boolean:
  anern_edit_mode:
    name: "Inverter edit mode (10 min)"
    icon: mdi:lock-open-variant
  anern_critical_settings:
    name: "Inverter critical settings"
    icon: mdi:shield-lock

template:
  - binary_sensor:
      - name: "Inverter data fresh (<5 min)"
        unique_id: anern_data_fresh
        device_class: connectivity
        state: >
          {% set t = states('sensor.anern_last_read') | as_datetime %}
          {{ t is not none and (now() - t).total_seconds() < 300 }}

automation:
  - id: anern_send_locks_to_bridge
    alias: "Inverter · send locks to the bridge"
    description: "The bridge only writes while the locks are on; publish their state over MQTT."
    mode: queued
    triggers:
      - trigger: state
        entity_id: [input_boolean.anern_edit_mode, input_boolean.anern_critical_settings]
      - trigger: homeassistant
        event: start
      - trigger: mqtt
        topic: homeassistant/status
        payload: online
    actions:
      - action: mqtt.publish
        data:
          topic: solar/rwb1_ble/locks
          retain: true
          payload: >
            {"edit": {{ is_state('input_boolean.anern_edit_mode', 'on') | tojson }},
             "critical": {{ (is_state('input_boolean.anern_edit_mode', 'on')
                             and is_state('input_boolean.anern_critical_settings', 'on')) | tojson }}}

  - id: anern_locks_auto_off
    alias: "Inverter · locks turn off after 10 min"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.anern_edit_mode
        to: "on"
        for: "00:10:00"
      - trigger: state
        entity_id: input_boolean.anern_critical_settings
        to: "on"
        for: "00:10:00"
      - trigger: homeassistant
        event: start
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: [input_boolean.anern_edit_mode, input_boolean.anern_critical_settings]

  - id: anern_fault_alert
    alias: "Inverter · fault alert"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.anern_fault_code
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['0', 'unknown', 'unavailable'] }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: anern_fault
          title: >
            {{ 'CRITICAL — ' if trigger.to_state.state == '61' else '' }}Inverter fault
          message: >
            {% if trigger.to_state.state == '61' %}BMS communication lost — the inverter may cut the output.
            {% else %}{{ states('sensor.anern_fault_text') }}{% endif %}

  - id: anern_warning_alert
    alias: "Inverter · warning for more than 2 min"
    triggers:
      - trigger: template
        value_template: "{{ states('sensor.anern_warning_code') not in ['0', 'unknown', 'unavailable'] }}"
        for: "00:02:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: anern_warning
          title: "Inverter warning"
          message: "{{ states('sensor.anern_warning_text') }}"

  - id: anern_no_data_alert
    alias: "Inverter · bridge without data"
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter_data_fresh_5_min
        to: "off"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: anern_no_data
          title: "Inverter without data"
          message: "The BLE bridge has not read the inverter for more than 5 minutes."
