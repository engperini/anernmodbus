      - type: markdown
        content: >-
          **Mapeamento provisório, aguardando o display:** 4542 = tensão de
          saída (220 V), não corrente da rede; 4544/4545 = retorno à
          rede/bateria em SBU (24,5/27,0 V); 4548 = corte por bateria baixa
          (24,0 V); 4549 = equalização (27,0 V). Os nomes exibidos hoje
          para esses cinco sensores são antigos e **não correspondem** a
          essas interpretações. Não foram renomeados; só o display permitirá
          confirmar os rótulos. Os demais códigos não têm enums confirmados;
          os bits são apenas posições. Não altere parâmetros da bateria com
          base nesses nomes.
