    cards:
      - type: markdown
        content: >-
          ## Controles — ainda não habilitados
          O teste local de escrita sem mudança em 5018 (prioridade da saída)
          retornou eco idêntico e a leitura 4537 permaneceu em 1. Não há
          selects ativos: faltam as opções e os textos confirmados no display.
          Correntes, tensões da bateria e LED permanecem somente leitura;
          este painel não envia comandos ao inversor. **Atenção:** cinco
          sensores de ajuste ainda exibem nomes antigos/incorretos; consulte
          o mapeamento provisório no aviso ao fim do painel.
