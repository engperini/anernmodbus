# Painel do inversor Anern AN-SCI-ECO-4200 (especificação: docs/07-home-assistant.md)
# Requer o pacote homeassistant/anern_package.yaml e a ponte bridge/bridge.py.
title: Inversor Anern
views:
  - title: Solar e bateria
    path: solar
    icon: mdi:solar-power
    cards:
      - type: markdown
        content: >-
          **ATENÇÃO** — bateria Felicity: confira manual e BMS antes de alterar
          parâmetros de bateria. Rede: 60 Hz / 220 V. As travas desligam em 10 min.
          Ajustes críticos exigem as duas travas e confirmação.

      - type: entities
        title: Travas de edição
        entities:
          - entity: input_boolean.anern_modo_edicao
            name: Modo edição do inversor (10 min)
          - entity: input_boolean.anern_ajustes_criticos
            name: Ajustes críticos

      - type: entities
        title: Grupo A · prioridades
        entities:
          - entity: select.anern_charger_source
            name: Fonte de carga (16)
          - entity: select.anern_output_source
            name: Fonte de saída (01)

      - type: entities
        title: Grupo B · parâmetros
        entities:
          - entity: number.anern_total_charge_current
            name: Corrente total (02)
          - entity: number.anern_grid_charge_current
            name: Corrente rede (11)
          - entity: number.anern_back_to_grid
            name: Volta rede (12)
          - entity: number.anern_back_to_battery
            name: Volta bateria (13)
          - entity: number.anern_bulk_voltage
            name: Carga bulk (26)
          - entity: number.anern_float_voltage
            name: Flutuação (27)
          - entity: number.anern_low_cutoff
            name: Corte bateria (29)
          - entity: number.anern_equalization_voltage
            name: Equalização (31)
          - entity: number.anern_equalization_time
            name: Tempo equaliz. (33)
          - entity: number.anern_equalization_timeout
            name: Limite equaliz. (34)
          - entity: number.anern_equalization_interval
            name: Intervalo equaliz. (35)

      - type: markdown
        content: >-
          Um ajuste por vez. Regras: corrente rede ≤ total;
          corte < volta rede < volta bateria; flutuação ≤ bulk.

      - type: vertical-stack
        cards:
          - type: markdown
            content: |-
              ### Grupo C · ajustes críticos
              Com a Felicity, manter LIL.

              Rede local: 60 Hz / 220 V.
          - type: entities
            entities:
              - entity: select.anern_ac_input_range
                name: Faixa CA (03)
              - type: button
                name: " "
                icon: mdi:check-bold
                action_name: Aplicar
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anern_ac_input_range_apply
                  confirmation:
                    text: Aplicar a faixa CA (03) escolhida no inversor?
              - type: divider
              - entity: select.anern_battery_type
                name: Tipo de bateria (05)
              - type: button
                name: " "
                icon: mdi:check-bold
                action_name: Aplicar
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anern_battery_type_apply
                  confirmation:
                    text: Aplicar o tipo de bateria (05) escolhido? Com a Felicity o certo é LIL.
              - type: divider
              - entity: select.anern_output_frequency_setting
                name: Frequência (09)
              - type: button
                name: " "
                icon: mdi:check-bold
                action_name: Aplicar
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anern_output_frequency_setting_apply
                  confirmation:
                    text: Aplicar a frequência (09) escolhida? A rede local é 60 Hz.
              - type: divider
              - entity: select.anern_output_voltage_setting
                name: Tensão de saída (10)
              - type: button
                name: " "
                icon: mdi:check-bold
                action_name: Aplicar
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.anern_output_voltage_setting_apply
                  confirmation:
                    text: Aplicar a tensão de saída (10) escolhida? A rede local é 220 V.

      - type: entities
        title: Grupo D · liga/desliga
        entities:
          - entity: switch.anern_alarm
            name: Alarme (18)
          - entity: switch.anern_backlight
            name: Luz de fundo (20)
          - entity: switch.anern_restart_overload
            name: Reinício após sobrecarga (06)
          - entity: switch.anern_restart_overtemp
            name: Reinício após sobretemperatura (07)
          - entity: switch.anern_beep_source_loss
            name: Apito na falha da rede (22)
          - entity: switch.anern_default_screen
            name: Tela padrão (19)
          - entity: switch.anern_overload_bypass
            name: Bypass na sobrecarga (23)
          - entity: switch.anern_fault_record
            name: Registro de falhas (25)

      - type: entities
        title: Solar
        entities:
          - entity: sensor.anern_pv_voltage
            name: Tensão FV
          - entity: sensor.anern_pv_power
            name: Potência FV

      - type: entities
        title: Bateria
        entities:
          - entity: sensor.anern_battery_voltage
            name: Tensão
          - entity: sensor.anern_battery_soc
            name: SOC (BMS)
          - entity: sensor.anern_battery_charge_current
            name: Corrente de carga
          - entity: sensor.anern_battery_discharge_current
            name: Corrente de descarga

      - type: entities
        title: Rede
        entities:
          - entity: sensor.anern_grid_voltage
            name: Tensão
          - entity: sensor.anern_grid_frequency
            name: Frequência

      - type: entities
        title: Saída e consumo
        entities:
          - entity: sensor.anern_output_voltage
            name: Tensão
          - entity: sensor.anern_output_frequency
            name: Frequência
          - entity: sensor.anern_load_active_power
            name: Potência ativa
          - entity: sensor.anern_load_apparent_power
            name: Potência aparente
          - entity: sensor.anern_load_percent
            name: Uso da capacidade

      - type: entities
        title: Equipamento
        entities:
          - entity: sensor.anern_operation_mode
            name: Modo de operação
          - entity: sensor.anern_ntc_temperature
            name: Temperatura NTC
          - entity: sensor.anern_led_text
            name: LED (39) · leitura
          - entity: binary_sensor.anern_charge_enabled
            name: Carga habilitada
          - entity: binary_sensor.anern_grid_active
            name: Rede ativa
          - entity: binary_sensor.anern_on_battery
            name: Na bateria

      - type: entities
        title: Diagnóstico
        entities:
          - entity: sensor.anern_fault_text
            name: Falha
          - entity: sensor.anern_warning_text
            name: Aviso
          - entity: sensor.anern_last_result
            name: Último resultado de ajuste
          - entity: binary_sensor.inversor_dados_recentes_5_min
            name: Dados recentes (<5 min)
          - entity: binary_sensor.anern_equalization
            name: Equalização (30) · leitura
          - entity: binary_sensor.anern_equalization_now
            name: Equalização imediata (36) · leitura
          - entity: sensor.anern_dual_cutoff_voltage
            name: Corte da saída dupla (42) · V
          - entity: sensor.anern_dual_cutoff_percent
            name: Corte da saída dupla (42) · %

      - type: markdown
        content: |-
          **Pendências técnicas**

          - 4501: códigos 0, 1, 2, 5 e 6 ainda não observados.
          - 4553: em 15/11 o modo era Bateria (4501 = 3) com "na bateria" desligado; o mapa dos bits precisa ser revisto.
          - 4555/4556: quase fixos (10 → 11); não são corrente de carga nem ciclos. Significado desconhecido.
          - 4554: programa 38 ou estado da bateria; confirmar à noite.
          - Programas 37 e 41 (valor 0) e 44 (valor 1, candidatos 4520/4560): registradores não identificados.
          - 4519, 4558, 4559, 4562–4564: desconhecidos.
          - LED: estado em 4561; endereço de escrita desconhecido.
          - 4529: confirmar como código de aviso quando aparecer um aviso real.
          - Dados detalhados do BMS: fora do bloco 4501–4564.
          - Escritas 5019–5021, 5023–5033 e Grupo D: ainda não testadas (primeiro uso: eco do valor atual).

      - type: entities
        title: Informações do equipamento
        entities:
          - entity: sensor.anern_cpu_version
            name: Versão da CPU (4518)
          - entity: sensor.anern_rated_power
            name: Potência nominal
          - entity: sensor.anern_rated_apparent_power
            name: Potência nominal (VA)
          - entity: sensor.anern_rated_ac_voltage
            name: Tensão CA nominal
          - entity: sensor.anern_rated_ac_current
            name: Corrente CA nominal
          - entity: sensor.anern_rated_battery_voltage
            name: Tensão nominal da bateria
          - entity: sensor.anern_rated_output_voltage
            name: Tensão de saída nominal
          - entity: sensor.anern_rated_frequency
            name: Frequência nominal
          - entity: sensor.anern_rated_output_current
            name: Corrente de saída nominal
